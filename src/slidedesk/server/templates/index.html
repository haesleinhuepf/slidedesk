<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>SlideDesk</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>

  <nav id="view-breadcrumb" aria-label="Location history">
    <button id="home-btn" type="button" title="Home" aria-label="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9" />
      </svg>
    </button>
    <button id="history-back-btn" type="button" title="Back" aria-label="Back" disabled>←</button>
    <button id="history-forward-btn" type="button" title="Forward" aria-label="Forward" disabled>→</button>
    <select id="history-select" aria-label="Current location and history"></select>
  </nav>

  <header id="toolbar">
    <input id="search-box" type="text" placeholder="Search slide text and press Enter…" />
    <select id="search-mode" title="Search mode">
      <option value="keyword" selected>Keyword search</option>
      <option value="semantic">Semantic search (AI)</option>
    </select>
    <button id="search-btn" type="button">Search</button>
    <button id="advanced-search-btn" type="button">Advanced Search</button>
    <label class="toggle">
      <input id="toggle-hidden" type="checkbox" />
      Hidden
    </label>
    <label class="toggle">
      <input id="toggle-layout" type="checkbox" checked />
      Layout
    </label>
    <span id="scan-status"></span>
    <span id="embedding-status"></span>
    <button id="exit-btn" type="button" title="Exit" aria-label="Exit">Exit</button>
  </header>


  <div id="viewport" tabindex="0" aria-label="Slide view. Use arrow keys or WASD to pan; hold Shift to pan faster.">
    <div id="canvas"></div>
    <div id="slide-zoom-nav" class="hidden">
      <button id="zoom-nav-prev" type="button" aria-label="Previous slide">‹</button>
      <button id="zoom-nav-next" type="button" aria-label="Next slide">›</button>
      <button id="zoom-nav-toggle" type="button" aria-label="Add to selection">+</button>
    </div>
  </div>

  <aside id="selection-bar" aria-label="Selected slides">
    <h2>Selected slides</h2>
    <span id="selection-count">0 selected</span>
    <div id="selection-actions">
      <button id="export-btn" disabled>Export selection</button>
      <button id="copy-selection-btn" disabled>Copy slides</button>
      <button id="clear-selection-btn" disabled>Clear selection</button>
    </div>
    <p id="selection-help">Right-click or hold a slide to add it to selection. Drag to reorder.</p>
    <div id="selected-slides" aria-label="Selection order"></div>
  </aside>

  <div id="slide-context-menu" class="context-menu">
    <button id="menu-add-selection">Add slide to selection</button>
    <button id="menu-zoom-slide">Zoom to slide</button>
    <button id="menu-show-in-deck">Show slide in deck</button>
    <button id="menu-show-similar">Show similar slides</button>
    <button id="menu-copy-slide">Copy slide</button>
    <button id="menu-open-deck">Open Slide Deck in PowerPoint</button>
    <button id="menu-open-deck-folder">Open Folder containing Slide Deck</button>
    <button id="menu-toggle-slide-hidden">Hide slide</button>
    <button id="menu-toggle-deck-hidden">Hide slide deck</button>
    <button id="menu-refresh-deck">Refresh slide deck</button>
    <button id="menu-remove" hidden>Remove slide</button>
  </div>

  <dialog id="advanced-search-dialog" aria-labelledby="advanced-search-title">
    <form method="dialog" class="advanced-search-header">
      <h2 id="advanced-search-title">Advanced Search</h2>
      <button id="advanced-search-close" type="submit" aria-label="Close">×</button>
    </form>
    <label for="advanced-search-prompt">Prompt</label>
    <textarea id="advanced-search-prompt" rows="3">List 20 slides about ...</textarea>
    <div class="advanced-search-actions">
      <button id="advanced-generate-list-btn" type="button">Generate List</button>
      <button id="advanced-cancel-generation-btn" type="button" hidden>Cancel generation</button>
      <span id="advanced-search-status" role="status" aria-live="polite"></span>
    </div>
    <label for="advanced-search-list">Slide topics</label>
    <textarea id="advanced-search-list" rows="15" placeholder="Generated bullet points will appear here. You can edit them before searching."></textarea>
    <div class="advanced-search-footer">
      <label for="advanced-slides-per-topic">Slides per bullet point</label>
      <input id="advanced-slides-per-topic" type="number" min="1" max="50" step="1" value="2" />
      <button id="advanced-generate-btn" type="button">Generate</button>
    </div>
  </dialog>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
