<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>slidedeck</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>
  <header id="toolbar">
    <input id="search-box" type="text" placeholder="Search slide text and press Enter…" />
    <select id="search-mode" title="Search mode">
      <option value="keyword" selected>Keyword search</option>
      <option value="semantic">Semantic search (AI)</option>
    </select>
    <label class="toggle">
      <input id="toggle-hidden" type="checkbox" />
      Show hidden slides
    </label>
    <span id="selection-count">0 selected</span>
    <button id="export-btn" disabled>Export selection</button>
    <button id="clear-selection-btn" disabled>Clear selection</button>
    <span id="scan-status"></span>
    <span id="embedding-status"></span>
  </header>

  <div id="view-breadcrumb" class="hidden">
    <span id="view-breadcrumb-label"></span>
    <button id="deck-refresh-btn" class="hidden">↻ Refresh deck</button>
    <button id="back-to-overview-btn">← Back</button>
  </div>

  <div id="viewport">
    <div id="canvas"></div>
  </div>

  <div id="slide-context-menu" class="context-menu">
    <button id="menu-show-in-deck">Show slide in slide deck</button>
    <button id="menu-show-similar">Show similar slides</button>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
